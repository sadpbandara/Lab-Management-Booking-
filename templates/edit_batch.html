{% extends 'base.html' %}
{% block content %}
<div class="max-w-md mx-auto bg-white p-8 rounded-2xl shadow-sm border border-slate-100 mt-12">
    <h2 class="text-2xl font-bold text-slate-800 mb-6 border-b pb-4">කණ්ඩායම සංස්කරණය</h2>
    <form method="POST" class="space-y-4">
        {% csrf_token %}
        <div>
            <label class="block text-sm font-medium text-slate-700 mb-1">Batch නම</label>
            <input type="text" name="name" value="{{ batch.name }}" required class="w-full px-4 py-2 border border-slate-300 rounded-lg outline-none">
        </div>
        <div>
            <label class="block text-sm font-medium text-slate-700 mb-1">විශේෂිත දිනය</label>
            <select name="dedicated_day" required class="w-full px-4 py-2 border border-slate-300 rounded-lg outline-none">
                <option value="0" {% if batch.dedicated_day == 0 %}selected{% endif %}>Monday</option>
                <option value="1" {% if batch.dedicated_day == 1 %}selected{% endif %}>Tuesday</option>
                <option value="2" {% if batch.dedicated_day == 2 %}selected{% endif %}>Wednesday</option>
                <option value="3" {% if batch.dedicated_day == 3 %}selected{% endif %}>Thursday</option>
                <option value="4" {% if batch.dedicated_day == 4 %}selected{% endif %}>Friday</option>
                <option value="5" {% if batch.dedicated_day == 5 %}selected{% endif %}>Saturday</option>
                <option value="6" {% if batch.dedicated_day == 6 %}selected{% endif %}>Sunday</option>
            </select>
        </div>
        <div class="pt-4 flex space-x-3">
            <a href="{% url 'manage_batches' %}" class="w-1/3 text-center bg-slate-100 text-slate-700 font-medium py-2 rounded-lg">ආපසු</a>
            <button type="submit" class="w-2/3 bg-indigo-600 text-white font-medium py-2 rounded-lg">Save Changes</button>
        </div>
    </form>
</div>
{% endblock %}
