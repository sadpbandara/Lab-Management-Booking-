{% extends 'base.html' %}
{% block content %}
<div class="max-w-md mx-auto bg-white p-8 rounded-2xl shadow-sm border border-slate-100 mt-12">
    <h2 class="text-2xl font-bold text-slate-800 mb-6 border-b pb-4">අවහිර කළ දිනය සංස්කරණය</h2>
    <form method="POST" class="space-y-4">
        {% csrf_token %}
        <div>
            <label class="block text-sm font-medium text-slate-700 mb-1">දිනය</label>
            <input type="date" name="date" value="{{ event.date|date:'Y-m-d' }}" required class="w-full px-4 py-2 border border-slate-300 rounded-lg outline-none focus:ring-2 focus:ring-indigo-500">
        </div>
        <div>
            <label class="block text-sm font-medium text-slate-700 mb-1">අවහිර කිරීමට හේතුව</label>
            <select name="event_type" required class="w-full px-4 py-2 border border-slate-300 rounded-lg outline-none focus:ring-2 focus:ring-indigo-500">
                <option value="holiday" {% if event.event_type == 'holiday' %}selected{% endif %}>Holiday</option>
                <option value="exam_it" {% if event.event_type == 'exam_it' %}selected{% endif %}>IT Exam</option>
                <option value="exam_english" {% if event.event_type == 'exam_english' %}selected{% endif %}>English Exam</option>
            </select>
        </div>
        <div>
            <label class="block text-sm font-medium text-slate-700 mb-1">විස්තරය (විකල්ප)</label>
            <input type="text" name="description" value="{{ event.description|default:'' }}" class="w-full px-4 py-2 border border-slate-300 rounded-lg outline-none focus:ring-2 focus:ring-indigo-500">
        </div>
        <div class="pt-4 flex space-x-3">
            <a href="{% url 'manage_holidays' %}" class="w-1/3 text-center bg-slate-100 text-slate-700 font-medium py-2 rounded-lg transition-colors hover:bg-slate-200">ආපසු</a>
            <button type="submit" class="w-2/3 bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-2 rounded-lg transition-colors shadow-sm">Save Changes</button>
        </div>
    </form>
</div>
{% endblock %}
