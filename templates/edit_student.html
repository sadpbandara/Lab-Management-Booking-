{% extends 'base.html' %}
{% block content %}
<div class="max-w-2xl mx-auto bg-white p-8 rounded-2xl shadow-sm border mt-8">
    <h2 class="text-2xl font-bold mb-6 border-b pb-4">සිසුවාගේ තොරතුරු සංස්කරණය</h2>
    <form method="POST">
        {% csrf_token %}
        <div class="space-y-4 mb-6">
            <input type="text" name="first_name" value="{{ student.user.first_name }}" class="w-full px-4 py-2 border rounded-lg" placeholder="First Name">
            <input type="text" name="last_name" value="{{ student.user.last_name }}" class="w-full px-4 py-2 border rounded-lg" placeholder="Last Name">
            <input type="text" name="reg_no" value="{{ student.reg_no }}" class="w-full px-4 py-2 border rounded-lg" placeholder="Reg No">
            <input type="text" name="e_number" value="{{ student.e_number }}" class="w-full px-4 py-2 border rounded-lg" placeholder="E-Number">
            <input type="text" name="programme" value="{{ student.programme }}" class="w-full px-4 py-2 border rounded-lg" placeholder="Programme">
            <select name="batch" class="w-full px-4 py-2 border rounded-lg">
                {% for batch in batches %}
                    <option value="{{ batch.id }}" {% if student.batch.id == batch.id %}selected{% endif %}>{{ batch.name }}</option>
                {% endfor %}
            </select>
        </div>
        <button type="submit" class="w-full bg-blue-600 text-white py-2 rounded-lg">Update Student</button>
    </form>
</div>
{% endblock %}
